<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Clicker+Script&family=Jost:ital,wght@0,100..900;1,100..900&display=swap");
            @import url("https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap");
            @import url("https://fonts.googleapis.com/css2?family=Meow+Script&display=swap");
            @import url('https://fonts.googleapis.com/css2?family=Delius&family=Meow+Script&display=swap');
        </style>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="assets/css/login.css">
        <title>Document</title>
    </head>
    <body>
        <div class="main">
            <div class="container">
                <div class="form">
                    <div class="sotd-logo">
                        <img src="assets/images/46.jpg" alt="" />
                    </div>
                    <h3>SOTD Nexus</h3>
                    <h4>Welcome! Please login to your account.</h4>
                    <div class="form-login">
                        <button id="discord-login">
                            <i class="fa-brands fa-discord"></i>
                            <p>Login with Discord</p>
                        </button>
                        <p>OR</p>
                        <form action="#" method="POST">
                            <input
                                type="text"
                                name="emailAdd"
                                id="email-address"
                                placeholder="Email Address"
                            />
                            <div class="password-container">
                                <input
                                    type="password"
                                    name="emailAdd"
                                    id="password"
                                    placeholder="Password"
                                />
                                <i
                                    class="fa-solid fa-eye"
                                    id="show-password"
                                ></i>
                            </div>
                            <button id="login-btn">LOGIN</button>
                        </form>
                        <div class="dont-have-an-account">
                            <p>
                                Don't have an account?
                                <a href="">Enlist here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
